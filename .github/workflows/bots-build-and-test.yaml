name: "Bots: Build and test"

on:
  push:
    paths:
      - "bots/**"
      - "proto/**.proto"
      - ".github/workflows/bots-build-and-test.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Generate gRPC impl
        run: uv run common/infrastructure/grpc/generate.py

      - name: Run formatter
        run: uv run ruff format --check

      - name: Run linter
        run: uv run ruff check

      - name: Perform type check
        run: uv run basedpyright

      - name: Ensure valid Python code
        run: cp config.template.yaml config.yaml && uv run python -c "import telegram.src.main"
        env:
          BOT_TOKEN: "123456:test"
          GRPC_TARGET: "localhost:9090"
          KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
          APP_PUBLIC_URL: "https://localhost:5173"
          KAFKA_CONSUMER_GROUP: "ci-bots"

      - name: Run tests
        run: uv run pytest tests
