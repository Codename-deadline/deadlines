name: "OpenAPI clients"

on:
  push:
    paths:
      - "api/openapi.json"
      - ".github/workflows/openapi-clients.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: bun i --frozen-lockfile

      - name: Verify that the client is up to date
        run: |
          bun run api:generate --fail-on-warnings
          changes=$(git status --porcelain --untracked-files=all -- src/api/generated)
          if [[ -n "$changes" ]]; then
            echo "Generated API is out of sync. Run bun run api:generate."
            echo "$changes"
            git diff -- src/api/generated
            exit 1
          fi
