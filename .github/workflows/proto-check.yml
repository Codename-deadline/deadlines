name: "Proto: Buf lint, format, and breaking checks"

on:
  push:
    paths:
      - "proto/**"
      - ".github/workflows/proto-check.yml"
  pull_request:
    paths:
      - "proto/**"
      - ".github/workflows/proto-check.yml"

jobs:
  buf:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Buf
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          input: proto
          push: false
          archive: false
          lint: true
          format: true
          pr_comment: true
          breaking: ${{ github.event_name == 'pull_request' }}
